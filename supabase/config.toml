# Only the settings OlympusGO needs. `supabase config push` changes only the
# values declared here, so everything else in the hosted project is left alone.

# Accounts are made only by resolve-login. Keep the hosted project the same.
[auth]
enable_signup = false

# Supabase Auth sends no mail of its own: every code is sent and checked by
# resolve-login. This hook refuses each send, so Auth can issue no email code
# or link, and a session cannot use Auth's own codes to get back in (Q268).
[auth.hook.send_email]
enabled = true
uri = "pg-functions://postgres/private/auth_email_refused"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
otp_length = 6
# Must stay on: off disables the email provider, and with it the internal
# sign-in that resolve-login uses. [auth] above is what stops direct sign-up.
enable_signup = true
enable_confirmations = false

[auth.email.template.magic_link]
subject = "Your OlympusGO code"
content_path = "./supabase/templates/code_email.html"

[auth.email.template.confirmation]
subject = "Your OlympusGO code"
content_path = "./supabase/templates/code_email.html"

# Sign-in is public, so the function checks nothing about the caller's token.
# Clips go up to 200 MB. The bucket holds the real limit.
[storage]
file_size_limit = "200MiB"

[functions.resolve-login]
verify_jwt = false

# Supabase never sends or checks a text message: see resolve-login.
[auth.sms]
enable_signup = false
enable_confirmations = false

[functions.admin-action]
verify_jwt = true

[functions.send-push]
verify_jwt = false

[functions.create-payment-intent]
verify_jwt = true

[functions.save-card]
verify_jwt = true

[functions.vendor-onboard]
verify_jwt = true

[functions.ai-plan]
verify_jwt = true

# Stripe signs these, and the function checks the signature.
[functions.stripe-webhook]
verify_jwt = false

# Answers 404 anywhere but a local stack.
[functions.stripe-local]
verify_jwt = false

# Called by pg_cron with a secret from Vault.
# Checks its own secret.
[functions.analysis-worker]
verify_jwt = false

[functions.feed-media]
verify_jwt = true

[functions.feed-worker]
verify_jwt = false

[functions.feed-local]
verify_jwt = false

# Answers 404 anywhere but a local stack.
[functions.analysis-local]
verify_jwt = false

[functions.money-worker]
verify_jwt = false
