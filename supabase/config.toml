# Only the settings OlympusGO needs. `supabase config push` changes only the
# values declared here, so everything else in the hosted project is left alone.

# Accounts are made only by resolve-login. Keep the hosted project the same.
[auth]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
otp_length = 6
# Must stay on: off disables the email provider, and with it the internal
# sign-in that resolve-login uses. [auth] above is what stops direct sign-up.
enable_signup = true
enable_confirmations = false

[auth.email.template.magic_link]
subject = "Your OlympusGO code"
content_path = "./supabase/templates/code_email.html"

[auth.email.template.confirmation]
subject = "Your OlympusGO code"
content_path = "./supabase/templates/code_email.html"

# Sign-in is public, so the function checks nothing about the caller's token.
[functions.resolve-login]
verify_jwt = false

# Supabase never sends or checks a text message: see resolve-login.
[auth.sms]
enable_signup = false
enable_confirmations = false

[functions.admin-action]
verify_jwt = true
